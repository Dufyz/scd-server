name: Deploy socket-server

on:
  push:
    branches: [main]
    paths:
      - "apps/socket-server/**"
      - ".github/workflows/deploy-socket-server.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/socket-server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scd-socket-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/scd-socket-server:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          PARAMS=$(jq -n \
            --arg c1 "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/scd-socket-server:latest" \
            --arg c2 "docker stop scd-socket-server || true" \
            --arg c3 "docker rm scd-socket-server || true" \
            --arg c4 "docker run -d \
              --name scd-socket-server \
              --restart unless-stopped \
              -p 8765:8765 \
              -e PORT=8765 \
              -e KAFKA_BROKERS='${{ secrets.KAFKA_BROKERS }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/scd-socket-server:latest" \
            '{"commands":[$c1,$c2,$c3,$c4]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.SOCKET_SERVER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SOCKET_SERVER_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SOCKET_SERVER_INSTANCE_ID }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text
