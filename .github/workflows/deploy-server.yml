name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to server instance 0
        run: |
          PARAMS=$(jq -n \
            --arg c1 "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:latest" \
            --arg c2 "docker stop scd-server || true" \
            --arg c3 "docker rm scd-server || true" \
            --arg c4 "docker run -d \
              --name scd-server \
              --restart unless-stopped \
              -p 3000:3000 \
              -e GO_ENV=production \
              -e PORT=3000 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e DATABASE_URL_REPLICA='${{ secrets.DATABASE_URL_REPLICA }}' \
              -e REDIS_PORT=6379 \
              -e REDIS_URL='${{ secrets.REDIS_URL }}' \
              -e REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
              -e REDIS_TTL_SECONDS=3600 \
              -e KAFKA_BROKERS='${{ secrets.KAFKA_BROKERS }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:latest" \
            '{"commands":[$c1,$c2,$c3,$c4]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.SERVER_INSTANCE_ID_0 }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SERVER_INSTANCE_ID_0 }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SERVER_INSTANCE_ID_0 }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text

      - name: Deploy to server instance 1
        run: |
          PARAMS=$(jq -n \
            --arg c1 "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:latest" \
            --arg c2 "docker stop scd-server || true" \
            --arg c3 "docker rm scd-server || true" \
            --arg c4 "docker run -d \
              --name scd-server \
              --restart unless-stopped \
              -p 3000:3000 \
              -e GO_ENV=production \
              -e PORT=3000 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e DATABASE_URL_REPLICA='${{ secrets.DATABASE_URL_REPLICA }}' \
              -e REDIS_PORT=6379 \
              -e REDIS_URL='${{ secrets.REDIS_URL }}' \
              -e REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
              -e REDIS_TTL_SECONDS=3600 \
              -e KAFKA_BROKERS='${{ secrets.KAFKA_BROKERS }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/scd-server:latest" \
            '{"commands":[$c1,$c2,$c3,$c4]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.SERVER_INSTANCE_ID_1 }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SERVER_INSTANCE_ID_1 }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.SERVER_INSTANCE_ID_1 }}" \
            --query "[StandardOutputContent,StandardErrorContent]" \
            --output text
