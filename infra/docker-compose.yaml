services:
  server-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - GO_ENV=${GO_ENV:-development}

      # Database
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-server-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-server-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=disable}

      # Redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-server-redis:6379}
      - REDIS_MONITOR_PORT=${REDIS_MONITOR_PORT:-8081}

      # Web URL
      - WEB_URL=${WEB_URL:-}

    depends_on:
      server-redis:
        condition: service_started
      server-db:
        condition: service_healthy
      dd-agent:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  server-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server-redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"

  server-redis-monitor:
    image: hibiken/asynqmon
    platform: linux/amd64
    ports:
      - "${REDIS_MONITOR_PORT:-8081}:8080"
    restart: unless-stopped
    networks:
      - app-network
    command: --redis-addr=server-redis:6379
    depends_on:
      - server-redis
socket-server:
    build:
      context: ../apps/socket-server
      dockerfile: Dockerfile
    ports:
      - "${SOCKET_PORT:-8765}:8765"
    environment:
      - PORT=${SOCKET_PORT:-8765}
      - REDIS_URL=redis://server-redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      server-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
